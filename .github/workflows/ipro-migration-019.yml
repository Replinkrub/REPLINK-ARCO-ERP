name: IPRO migration 019

on:
  pull_request:
    paths:
      - '.github/workflows/ipro-migration-019.yml'
      - 'scripts/db-migrate.mjs'
      - 'src/infrastructure/postgres/migrations/016_ipro_foundation.sql'
      - 'src/infrastructure/postgres/migrations/017_ipro_canonical_product_gate.sql'
      - 'src/infrastructure/postgres/migrations/018_ipro_product_alias_represented_scope.sql'
      - 'src/infrastructure/postgres/migrations/019_ipro_controlled_reprocessing.sql'
      - 'tests/dbMigrate.spec.js'
      - 'tests/iproReprocessingMigration.integration.spec.js'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ipro-migration-019.yml'
      - 'scripts/db-migrate.mjs'
      - 'src/infrastructure/postgres/migrations/016_ipro_foundation.sql'
      - 'src/infrastructure/postgres/migrations/017_ipro_canonical_product_gate.sql'
      - 'src/infrastructure/postgres/migrations/018_ipro_product_alias_represented_scope.sql'
      - 'src/infrastructure/postgres/migrations/019_ipro_controlled_reprocessing.sql'
      - 'tests/dbMigrate.spec.js'
      - 'tests/iproReprocessingMigration.integration.spec.js'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ipro_reprocessing_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ipro_reprocessing_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ipro_reprocessing_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Prove canonical migrations are idempotent
        run: |
          node --input-type=module -e "import pg from 'pg'; const client = new pg.Client({ connectionString: process.env.DATABASE_URL }); await client.connect(); await client.query('CREATE SCHEMA IF NOT EXISTS ipro'); await client.end();"
          npm run db:migrate
          second_run="$(npm run db:migrate)"
          printf '%s\n' "$second_run"
          [[ "$second_run" == *"Migration run completed (0 applied, 19 skipped)."* ]]

      - name: Reset disposable database for migration integration
        run: |
          node --input-type=module -e "import pg from 'pg'; const client = new pg.Client({ connectionString: process.env.DATABASE_URL }); await client.connect(); await client.query('DROP SCHEMA IF EXISTS ipro CASCADE'); await client.query('DROP TABLE IF EXISTS schema_migrations'); await client.end();"

      - name: Migration 019 PostgreSQL integration
        run: npx vitest run tests/iproReprocessingMigration.integration.spec.js
        env:
          IPRO_REPROCESSING_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ipro_reprocessing_ci
